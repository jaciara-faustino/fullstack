<html>
    <head>
        <title> Inputs <dialog></dialog>o HTML</title>
    </head>
    <body>
        <h1> Inputs do HTML</h1>

        <form>
            <!--Campo de Texto 
            placeholder = mostra um exemplo / orientação ao usuário -->
            <label for="nome"> Nome:</label>
            <input type=" "text" name="nome" id="nome" required placeholder="Ex: Jaciara Faustino">
            <br></br>

            <!-- Campo de email-->
             <label for="email"> Email:</label>
             <input type="email" name="email" id="email" required>
             <br></br>

            <!--Campo de Senha-->
             <label for = "senha"> Senha:</label>
             <input type="password" name="senha" id="senha" required>
             <br></br>

            <!--Campo de seleção radio-->
            <label> Gênero:</label><br>

            <input type="radio" name="genero" id="masculino" value="m">
            <label for="masculino"> Masculino</label>

            <input type="radio" name="genero" id="feminino" value="f" >
            <label for="feminino"> Feminino</label>
            <br></br>

            <!--Campo de seleção múltipla checkbox-->
            <label>Interesses:</label><br>
            <input type="checkbox" name="interesses" id="backend" value="backend">
            <label for="backend"> Back-end</label>
            <input type="checkbox" name="interesses" id="frontend" value="frontend">
            <label for="frontend"> Front-end</label>
            <input type="checkbox" name="interesses" id="mobile" value="mobile">
            <label for="mobile"> Mobile</label>
            <br></br>

            <!--Campo de data-->
            <label for = "datadenascimento"> Data de Nascimento:</label><br>
            <input type="date" name="datadenascimento" id="datadenascimento">
            <br></br>

            <!--Campo de Arquivo(upload)-->
            <label for = "arquivo"> Arquivo:</label><br>
            <input type="file" name="arquivo" id="arquivo">

            <br></br>
            
        

            <!-- Campo de caixa de seleção-->
            <label for = "situacao"> Situação Atual:</label><br>
            <select name="situacao" id="situacao"> 
                <option value="" disabled selected>Selecione uma das opções</option>
                <option value="estudante">Estudando para ser um programador</option>
                 <option value="estagiario">Atuando como estagiário/trainee</option>
                <option value="junior">Atuando como desenvolvedor júnior</option>
                <option value="pleno">Atuando como desenvolvedor pleno</option>
                <option value="senior">Atuando como desenvolvedor sênior</option>

            </select>
            <br></br>

            <!-- Campo de área de texto de múltiplas linhas
             cols e rows definem o tamanho da caixa, não do conteúdo-->
            <label for = "sobre"> Sobre Mim:</label><br>
            <textarea name = "sobre" id="sobre" cols="30" rows="5" placeholder="Fale um pouco sobre você.."></textarea>


        <br></br>
        <button type="submit"> Enviar</button>
        </form>
    </body>
</html>
